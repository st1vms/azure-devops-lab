apiVersion: batch/v1
kind: Job
metadata:
  name: ud17-carico
  namespace: ft152-catalogo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app: ud17-carico
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: carico
          image: catalog-backend:ud16
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/scripts/carico_http.py", "http://backend:8000/api/products", "120"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: ud17-carico-script
