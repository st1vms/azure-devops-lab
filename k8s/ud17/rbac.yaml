apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-reader
  namespace: ft152-catalogo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: ft152-catalogo
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-reader
  namespace: ft152-catalogo
subjects:
- kind: ServiceAccount
  name: catalog-reader
  namespace: ft152-catalogo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
