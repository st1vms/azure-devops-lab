trigger:
- main

# Agent Microsoft-hosted.
pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sc-azure-ud13-15'
  deliveryResourceGroup: 'rg-ud13-15-delivery'
  imageRepository: 'catalog-backend'
  dockerfilePath: '$(Build.SourcesDirectory)/app/catalog-backend-ci/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)/app/catalog-backend-ci'
  imageTag: '$(Build.BuildId)'

stages:

- stage: Test
  displayName: Test application
  jobs:
  - job: PythonTests
    displayName: Python tests on Microsoft-hosted agent
    steps:

    - checkout: self
      clean: true

    - bash: |
        echo "Agent.Name=$(Agent.Name)"
        echo "Agent.OS=$(Agent.OS)"
        echo "Agent.MachineName=$(Agent.MachineName)"
        echo "Build.SourcesDirectory=$(Build.SourcesDirectory)"
        echo
        python3 --version
      displayName: Inspect hosted test environment

    - bash: |
        python3 -m unittest discover \
          -s app/catalog-backend-ci/tests \
          -v
      displayName: Run Python tests

- stage: BuildPush
  displayName: Build and push image
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: DockerBuild
    displayName: Docker build on Microsoft-hosted agent
    steps:

    - checkout: self
      clean: true

    - bash: |
        echo "Agent.Name=$(Agent.Name)"
        echo "Agent.OS=$(Agent.OS)"
        echo "Agent.MachineName=$(Agent.MachineName)"
        echo "Build.SourcesDirectory=$(Build.SourcesDirectory)"
        echo
        docker --version
      displayName: Inspect hosted Docker environment

    # La sessione Azure usa l'identità federata della service connection ARM.
    - task: AzureCLI@2
      displayName: Build and push to ACR using ARM connection
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          # Nel Resource Group del laboratorio deve esserci un solo ACR.
          ACR_COUNT=$(az acr list --resource-group "$DELIVERY_RG" --query 'length(@)' --output tsv)
          if [ "$ACR_COUNT" != "1" ]; then
            echo "Atteso un solo ACR in $DELIVERY_RG; trovati: $ACR_COUNT"
            exit 1
          fi
          ACR_NAME=$(az acr list --resource-group "$DELIVERY_RG" --query '[0].name' --output tsv)
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          IMAGE_REF="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$IMAGE_TAG"

          az acr login --name "$ACR_NAME"
          docker build --file "$DOCKERFILE_PATH" --tag "$IMAGE_REF" "$BUILD_CONTEXT"
          docker push "$IMAGE_REF"
          echo "Immagine pubblicata: $IMAGE_REF"
      env:
        DELIVERY_RG: '$(deliveryResourceGroup)'
        IMAGE_REPOSITORY: '$(imageRepository)'
        IMAGE_TAG: '$(imageTag)'
        DOCKERFILE_PATH: '$(dockerfilePath)'
        BUILD_CONTEXT: '$(buildContext)'